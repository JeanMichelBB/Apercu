apiVersion: apps/v1
kind: Deployment
metadata:
  name: apercu-backend
  annotations:
    secrets.doppler.com/reload: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apercu-backend
  template:
    metadata:
      labels:
        app: apercu-backend
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox
          command: ['sh', '-c', 'until nc -z mysql 3306; do echo "Waiting for MySQL..."; sleep 3; done']
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: apercu-backend
          image: jeanmichelbb/ap-be:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: apercu-backend-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: apercu-backend
spec:
  selector:
    app: apercu-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: apercu-backend-metrics
spec:
  type: NodePort
  selector:
    app: apercu-backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30084
