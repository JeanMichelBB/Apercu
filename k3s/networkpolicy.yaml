apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-apercu-frontend
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: apercu-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 80
---
# /metrics shares the API port (8000) with the main app, and Prometheus's NodePort scrape
# needs to reach it. Tried scoping ingress to Traefik + the node flannel-gateway IPs the SNAT'd
# scrape traffic appears to use (confirmed via this pod's own access log) -- that broke real
# Prometheus scraping in the homelab-dashboard pilot (verified live: the target went down within
# one scrape interval of the policy syncing), most likely because kube-router's NetworkPolicy
# enforcement evaluates the connection at a different point in the iptables chain than where the
# app sees the post-NAT source address, so the ipBlock never actually matched the real packet.
# Left this port unrestricted rather than ship a rule that looks tight but silently breaks
# monitoring.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-apercu-backend
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: apercu-backend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
